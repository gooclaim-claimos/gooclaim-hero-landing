<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Only the <title> belongs here. react-helmet-async REPLACES the title but
      APPENDS every meta and link, so anything else written here survives
      alongside the route's own tag and is served twice.

      🔴 The canonical was the costly one: this file hard-coded
      `https://www.gooclaim.com/`, so /pricing, /security, /orion, /platform and
      every use-case page told Google they were the homepage — an instruction to
      drop them from the index as duplicates. SEOHead already emits a correct
      per-route canonical, plus description, og:*, twitter:* and robots, and
      every route is prerendered, so each page ships its own set. Do not add
      meta or link tags back here; add them to SEOHead.
    -->
    <title>Gooclaim OS · The operating system for India's claims industry</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo-gooclaim.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink-900 text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
